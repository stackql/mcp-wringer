name: Validate release

on:
  release:
    types: [published]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match package.json version');"

      - name: Install dependencies
        run: npm ci

      - name: Run checks and build release artifacts
        run: |
          npm run check
          npm run test:matrix
          npm run build
          npm run check:action
          npm run test:action
          npm run check:plugin-api
          npm run check:package
          npm run docs:config:check
