name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match package.json version');"

      - name: Install dependencies
        run: npm ci

      - name: Install npm trusted-publishing support
        run: npm install --global npm@11.5.1

      - name: Run checks and build release artifacts
        run: |
          npm run check
          npm run build
          npm run build:action
          npm run check:plugin-api
          npm run check:package

      - name: Verify npm trusted-publishing support
        run: npm run check:npm-publish

      - name: Publish with trusted publishing and provenance
        run: npm publish --provenance --access public
